# pre-commit hooks – installed by `make setup` / scripts/bootstrap.sh for the stages pre-commit, commit-msg, pre-push.
#   uv run pre-commit run --all-files                       # all pre-commit hooks
#   uv run pre-commit run --hook-stage pre-push --all-files # the slower pre-push checks
# Ruff and mypy run from the project environment (versions pinned by uv.lock, identical to CI).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"
# Fuzz seed corpora are binary inputs (leading selector bytes) – no text/format hooks.
exclude: ^fuzz/corpus/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe] # mkdocs.yml uses custom tags; only syntax is checked
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, refactor, perf, test, build, ci, chore, revert, style]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit, pre-push]
      - id: private-data
        name: private data (patterns from untracked .private-patterns / CLAUDE.local.md)
        entry: python3 scripts/check_private_data.py
        language: system
        types: [text]
        exclude: ^(uv\.lock|\.private-patterns|CLAUDE\.local\.md)$
      - id: pytest
        name: pytest (mocks only, no live box)
        entry: uv run --frozen pytest -q -x -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: tool-reference
        name: docs/TOOLS.md up to date
        entry: uv run --frozen python scripts/gen_tool_reference.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: coverage-stats
        name: docs/COVERAGE.md statistics up to date
        entry: uv run --frozen python scripts/coverage_stats.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
