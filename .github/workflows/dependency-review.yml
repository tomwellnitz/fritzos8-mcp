name: Dependency review

# Blocks PRs that add dependencies with known vulnerabilities or incompatible licenses.
# Needs the dependency graph (free for public repositories) – skipped in a private repository.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # MIT project: permissive licenses plus the weak-copyleft ones of existing dependencies (certifi MPL-2.0,
          # paho-mqtt EPL-2.0). Extend deliberately if a new dependency needs another license.
          allow-licenses: >-
            MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, PSF-2.0, Python-2.0, MPL-2.0, Unlicense,
            0BSD, EPL-2.0, BSD-3-Clause-Clear, Zlib, CC0-1.0
          # PyInstaller (GPL-2.0 with the bootloader exception that permits bundling any program) is only used in the
          # linux-only "fuzz" dependency group to pack the ClusterFuzzLite targets – never shipped with the package.
          allow-dependencies-licenses: >-
            pkg:pypi/pyinstaller, pkg:pypi/pyinstaller-hooks-contrib
          comment-summary-in-pr: on-failure
