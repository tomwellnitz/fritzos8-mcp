name: Release

# Runs when a GitHub release is published (created by release-please, see release-please.yml) or manually for an
# existing tag. Builds once, attests the build provenance, attaches sdist/wheel to the release and publishes:
#   - PyPI via Trusted Publishing (OIDC, environment "pypi") – only if the repository variable PUBLISH_PYPI=true,
#   - the multi-arch container image (linux/amd64, linux/arm64) to ghcr.io/<owner>/fritzos8-mcp with SBOM + provenance,
#   - the official MCP Registry entry (server.json, GitHub OIDC) after PyPI – only if PUBLISH_MCP_REGISTRY=true,
#   - the Claude Desktop bundle fritzos8-mcp-<version>.mcpb (scripts/build_mcpb.sh), attested and attached.
#
# SLSA provenance as release assets: the Sigstore bundle written by actions/attest-build-provenance (JSON Lines, one
# signed in-toto statement with a https://slsa.dev/provenance/v1 predicate per line) is attached next to the files it
# covers as *.intoto.jsonl – the same attestation that `gh attestation verify` finds online, usable offline with
# `gh attestation verify <file> --bundle <file>.intoto.jsonl --repo <owner>/<repo>`. OpenSSF Scorecard
# ("Signed-Releases") counts *.intoto.jsonl assets as provenance (score 10). We deliberately do not use the
# slsa-github-generator reusable workflows: their README requires a tag reference (@vX.Y.Z, never a commit SHA) so
# that slsa-verifier can check the trusted builder's ref – that conflicts with our rule to pin every action to a
# commit SHA, and Scorecard "Pinned-Dependencies" reports such a tag reference as unpinned.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/fritzos8-mcp

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload release assets
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tag matches the package version
        run: |
          version="$(uv version --short)"
          test "$TAG" = "v$version" || { echo "::error::Tag $TAG does not match pyproject version $version"; exit 1; }
      - name: Tests
        run: uv run --frozen --all-extras pytest
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uv run --frozen --only-group dev twine check --strict dist/*
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Only the distributions – `uv build` also writes dist/.gitignore, which must not be an attested subject.
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attach sdist + wheel and their SLSA provenance to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The provenance file stays outside dist/, which is uploaded to PyPI unchanged.
        run: |
          provenance="$RUNNER_TEMP/fritzos8-mcp-${TAG#v}.intoto.jsonl"
          cp "$BUNDLE" "$provenance"
          gh release upload "$TAG" dist/* "$provenance" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: pypi
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/fritzos8-mcp/
    permissions:
      id-token: write # Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  mcpb:
    name: mcpb
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the bundle to the release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Bundle manifest matches the release
        run: |
          test "$(jq -r .version mcpb/manifest.json)" = "${TAG#v}" \
            || { echo "::error::mcpb/manifest.json version does not match $TAG"; exit 1; }
      - name: Build the Claude Desktop bundle (mcpb CLI pinned in mcpb/package-lock.json)
        run: scripts/build_mcpb.sh
      - name: Smoke test (start as the manifest says, initialize + tools/list, dummy config)
        run: python3 scripts/mcpb_smoke.py "dist/fritzos8-mcp-${TAG#v}.mcpb"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mcpb
      - name: Attach the bundle and its SLSA provenance to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          provenance="$RUNNER_TEMP/fritzos8-mcp-${TAG#v}.mcpb.intoto.jsonl"
          cp "$BUNDLE" "$provenance"
          gh release upload "$TAG" "dist/fritzos8-mcp-${TAG#v}.mcpb" "$provenance" --clobber --repo "$GITHUB_REPOSITORY"

  docker:
    name: docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=fritzos8-mcp
            org.opencontainers.image.description=MCP server for AVM FRITZ!Box with FRITZ!OS 8 – tiered write safety, read-back, redaction
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  mcp-registry:
    name: mcp-registry
    needs: pypi
    if: vars.PUBLISH_MCP_REGISTRY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry (namespace io.github.<owner>)
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: server.json matches the release
        run: |
          v="${TAG#v}"
          test "$(jq -r .version server.json)" = "$v" && test "$(jq -r '.packages[0].version' server.json)" = "$v" \
            || { echo "::error::server.json version does not match $TAG"; exit 1; }
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher && rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # PyPI can need a moment until the new release (with the mcp-name marker in its README) is visible.
          for _ in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; echo "retry in 30 s"; sleep 30; done
          exit 1
