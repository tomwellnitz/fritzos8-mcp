name: ClusterFuzzLite PR fuzzing

# Fuzzes every pull request that touches code or fuzz targets for a few minutes (code-change mode) with the atheris
# targets in fuzz/ (build: .clusterfuzzlite/). Crashes fail the check and are uploaded as artifacts.
# Corpus and long runs: cflite-batch.yml.
on:
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cflite-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (address)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # look up the latest batch corpus artifact
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ github.token }}
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
