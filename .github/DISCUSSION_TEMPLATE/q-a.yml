title: "[Q&A] "
labels: ["type/question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking! Please **never post passwords, Wi-Fi keys, MAC addresses, public IPs or MyFRITZ! addresses** – redact them first.
        Found a bug? Use the bug report form instead. Security issue? Report it privately (see SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what happened?
    validations:
      required: true
  - type: input
    id: box
    attributes:
      label: FRITZ!Box model and FRITZ!OS version
      placeholder: "FRITZ!Box 7590 AX, 8.25"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options: [Claude Code, Claude Desktop, Cursor, VS Code, other]
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Output of setup_check (redacted)
      description: Run the `setup_check` tool and paste the result – it shows rights, reachable interfaces and active tiers.
      render: json
