name: Compatibility report
description: Share the result of the read-only live suite on your box (works / does not work)
title: "compat: "
labels: ["type/compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The live suite only **reads** from your box. Run it with your own credentials (never post them):
        `FRITZ_LIVE_TEST=1 FRITZ_HOST=… FRITZ_USER=… FRITZ_PASSWORD_FILE=… uv run pytest tests/live -o addopts="" -v`
  - type: input
    id: model
    attributes:
      label: FRITZ!Box model
      placeholder: "FRITZ!Box 5590 Fiber"
    validations:
      required: true
  - type: input
    id: fritzos
    attributes:
      label: FRITZ!OS version
      placeholder: "8.21"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fritzos8-mcp version or commit
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Internet access
      options: [DSL, Cable, Fibre, LTE/5G, IP client behind another router, other]
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Result of tests/live
      description: passed / skipped / failed per test – without personal data.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Tools that behave differently, missing fields, firmware quirks.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include addresses, serial numbers, device names, phone numbers or credentials.
          required: true
